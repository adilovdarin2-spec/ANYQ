# Проверка живости — снаружи того, что проверяет.
#
# Планировщик (`scripts/maintenance.mjs`) живёт на Railway рядом со службами и
# поэтому не может сообщить, что Railway лежит: он лежит вместе с ним. Эта
# проверка запускается у GitHub — другой компании, другого облака, — и именно
# поэтому ей можно верить, когда она говорит «не отвечает».
#
# Канал уведомления по умолчанию — письмо от GitHub об упавшем расписании.
# Это не изящно и ничего не стоит: ни аккаунта, ни бота, ни секрета. Когда
# понадобится телеграм, заведите секреты ANYQ_ALERT_TELEGRAM_TOKEN и
# ANYQ_ALERT_TELEGRAM_CHAT — скрипт подхватит их сам.
#
# Раз в пятнадцать минут: чаще — это минуты, потраченные на то, чтобы узнать
# на десять минут раньше о поломке, чинить которую всё равно человеку.
name: Проверка живости

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Отменять предыдущую проверку, если началась новая: две одновременные ничего
# не добавляют, а очередь из них после долгого простоя GitHub — добавляет шум.
concurrency:
  group: uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Зависимостей у проверки нет намеренно: `npm ci` на весь монорепозиторий
      # ради одного fetch — это минуты и ещё одна причина, по которой проверка
      # может покраснеть не из-за боевого.
      - name: Проверить, что всё отвечает
        env:
          ANYQ_ALERT_TELEGRAM_TOKEN: ${{ secrets.ANYQ_ALERT_TELEGRAM_TOKEN }}
          ANYQ_ALERT_TELEGRAM_CHAT: ${{ secrets.ANYQ_ALERT_TELEGRAM_CHAT }}
        run: node scripts/uptime-check.mjs
