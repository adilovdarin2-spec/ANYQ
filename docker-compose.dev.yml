# The development database. Separate from anything deployed, on a non-default
# port, so a local run can never reach a real one by accident — which the
# shared DATABASE_URL in .env.example previously invited.
#
#   docker compose -f docker-compose.dev.yml up -d
#   cd packages/db && npx prisma migrate deploy && npx prisma db seed
#
# And for the integration suite:
#   DATABASE_URL=...anyq_test npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
#   DATABASE_URL=...anyq_test JWT_SECRET=test npm run test:db
services:
  db:
    image: postgres:16-bookworm
    container_name: anyq-db
    # Без обещаний о сохранности — эта база одноразовая.
    #
    # Интеграционный прогон очищает все таблицы перед каждым тестом, а каждый
    # TRUNCATE в Postgres по умолчанию ждёт, пока ядро действительно запишет
    # файлы на диск. На Docker Desktop под Windows этот дождь из fsync стоит
    # секунды: прогон, который считается три минуты, упирался в тридцать секунд
    # таймаута на каждом втором тесте — и падал не по делу, а по диску.
    #
    # Здесь это выключено намеренно и только здесь. Потерять эту базу не жалко:
    # `anyq_test` вытирается каждым прогоном, `anyq_dev` разворачивается
    # миграциями и сидом за минуту. В боевом Postgres ничего подобного нет и
    # быть не может — там эти настройки означают потерю чужих продаж при
    # отключении света.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_USER: anyq
      POSTGRES_PASSWORD: anyq_dev
      POSTGRES_DB: anyq_dev
    # 5433, not 5432: a developer with Postgres already installed should not
    # have to choose between the two, and a typo in a connection string should
    # not silently land on the wrong server.
    ports:
      - '5433:5432'
    volumes:
      - anyq-db-data:/var/lib/postgresql/data
      # Creates anyq_test alongside anyq_dev on first start. The integration
      # tests truncate every table between cases, so they must never share a
      # database with anything a person is looking at.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anyq -d anyq_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  anyq-db-data:
